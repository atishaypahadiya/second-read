<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>second read</title>
  <link rel="stylesheet" href="ui/tokens.css">
  <link rel="stylesheet" href="ui/fonts.css">
  <link rel="stylesheet" href="ui/components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="sr-popup sr-sheet sr-ui" id="app">
    <div class="sr-popup__head">
      <span class="sr-popup__name">second read</span>
      <span class="sr-chip sr-chip--status" id="status"><span class="sr-dot sr-dot--faint" id="statusDot"></span><span id="statusText">checking</span></span>
    </div>

    <!-- main: what the extension has done for you first, settings below -->
    <div class="sr-pane" id="pane-main">
      <div class="sr-card sr-hero" id="hero">
        <span class="sr-hero__num" id="savedAll">0:00</span>
        <span class="sr-hero__cap">saved all-time</span>
        <div class="sr-chips">
          <span class="sr-chip sr-chip--mono" id="savedToday">today 0:00</span>
        </div>
        <span class="sr-hero__line" id="trust"></span>
      </div>

      <div class="sr-video" id="video" hidden>
        <div class="sr-rows__head"><span class="sr-label">this video</span><span class="sr-hint" id="videoLen"></span></div>
        <div class="sr-hairline"><div class="sr-hairline__track" id="videoTrack"></div></div>
        <div id="videoRows"></div>
        <ul class="sr-list" id="videoDeal"></ul>
      </div>

      <div class="sr-channel" id="channel">
        <span class="sr-channel__thumb" id="channelThumb"></span>
        <div class="sr-channel__text">
          <span class="sr-channel__name" id="channelName">no video</span>
          <span class="sr-channel__sub" id="channelSub">open a youtube video</span>
        </div>
        <button class="sr-button--text" id="allowBtn" hidden></button>
      </div>

      <div class="sr-rows" id="rows">
        <div class="sr-rows__head">
          <span class="sr-label">categories</span>
          <button class="sr-button--text sr-more" id="moreBtn" aria-expanded="false" aria-controls="moreRows">
            <span id="moreText">more categories</span><span class="sr-chip sr-chip--mono" id="moreCount" hidden></span>
          </button>
        </div>
        <div id="mainRows"></div>
        <div id="moreRows" hidden></div>
      </div>

      <!-- the off switch is a setting, not the point: it sits at the end of the pane -->
      <button class="sr-button sr-button--sm sr-toggle" id="enabled" aria-pressed="true" title="Turn skipping on or off">
        <span id="enabledLabel">Skipping on</span>
        <span class="sr-toggle__track"><span class="sr-toggle__knob"></span></span>
      </button>
    </div>

    <!-- codes & more -->
    <div class="sr-pane" id="pane-more" hidden>
      <span class="sr-label">codes</span>
      <input class="sr-input" type="search" id="codeSearch" placeholder="Search brand, code, creator" autocomplete="off">
      <ul class="sr-list sr-scroll" id="codeList"></ul>
      <div class="sr-hint" id="codeHint">Codes, links and offers from analyzed sponsor reads.</div>

      <span class="sr-label">channels you don't skip</span>
      <ul class="sr-list" id="allowlist"></ul>
      <div class="sr-hint" id="allowHint">Markers still show on these channels; nothing is skipped.</div>

      <div class="sr-rows__head">
        <label class="sr-check" title="Show the status badge on the player and write logs to the console"><input type="checkbox" id="devMode"> dev mode <span class="sr-hint">badge + logs</span></label>
        <span class="sr-hint" id="version"></span>
      </div>
    </div>

    <div class="sr-popup__spacer"></div>
    <div class="sr-popup__foot">
      <button class="sr-button--text" id="missedBtn" title="Report that an ad is playing right now and was not marked" disabled>Missed an ad here</button>
      <button class="sr-button--text" id="moreNav">Codes &amp; more</button>
      <a class="sr-button--text" href="http://127.0.0.1:8765/dashboard" target="_blank" rel="noopener">Dashboard ↗</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
