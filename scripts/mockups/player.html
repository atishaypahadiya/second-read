<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Second Read player mockup</title>
<!-- The extension's own styles, in the order manifest.json injects them -->
<link rel="stylesheet" href="/ext/ui/tokens.css">
<link rel="stylesheet" href="/ext/ui/fonts-content.css">
<link rel="stylesheet" href="/ext/ui/components.css">
<link rel="stylesheet" href="/ext/content.css">
<style>
  /* A generic video player (not YouTube's): just enough DOM for content.js to find its anchors. */
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #movie_player { position: relative; width: 100vw; height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  #movie_player video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .m-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .m-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 180px; pointer-events: none;
             background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.62)); }
  .ytp-progress-bar-container { position: absolute; left: 12px; right: 12px; bottom: 47px; height: 5px; }
  .ytp-progress-bar { position: absolute; left: 0; right: 0; top: 1px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.22); }
  .m-loaded { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: rgba(255,255,255,.28); }
  .m-played { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: rgba(255,255,255,.92); }
  .m-knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; }
  .m-controls { position: absolute; left: 12px; right: 12px; bottom: 0; height: 46px; display: flex; align-items: center; gap: 18px; color: #fff; }
  .m-controls svg { width: 22px; height: 22px; fill: #fff; opacity: .92; }
  .m-time { font-size: 13px; letter-spacing: .02em; opacity: .9; font-variant-numeric: tabular-nums; }
  .m-spacer { flex: 1; }
  .m-cc { font-size: 11px; font-weight: 600; border: 1.5px solid rgba(255,255,255,.9); border-radius: 3px; padding: 1px 3px; opacity: .9; }
  /* the pointer, drawn (a screenshot has none) */
  .m-pointer { position: absolute; width: 18px; height: 22px; z-index: 200; pointer-events: none; display: none; }
</style>
<!-- the fictional data (served by render.js), then the harness, then the real content script -->
<script src="/mock/fixture.js"></script>
<script>
(() => {
  const F = window.__FIXTURE;
  // ---- virtual clock: content.js's timers (toast 6 s, marker tick 1 s) and the CSS animations run on it, so every
  // frame is deterministic however long a screenshot takes.
  const realSetTimeout = window.setTimeout.bind(window);
  const timers = new Map();
  let nextId = 1, vnow = 0;
  window.setTimeout = (fn, ms = 0, ...a) => { const i = nextId++; timers.set(i, { t: vnow + Math.max(0, +ms || 0), fn, a }); return i; };
  window.setInterval = (fn, ms = 0, ...a) => { const i = nextId++; timers.set(i, { t: vnow + Math.max(1, +ms || 0), fn, a, every: Math.max(1, +ms || 0) }); return i; };
  window.clearTimeout = window.clearInterval = (i) => { timers.delete(i); };
  const flush = () => new Promise((r) => realSetTimeout(r, 0));   // lets content.js's promise chains settle
  const starts = new WeakMap();
  function syncAnimations() {
    for (const a of document.getAnimations()) {
      if (!starts.has(a)) starts.set(a, vnow);
      a.pause();
      a.currentTime = vnow - starts.get(a);
    }
  }
  async function advance(ms) {
    syncAnimations();   // animations that started since the last step start now, not at the end of this one
    const end = vnow + ms;
    for (;;) {
      let due = null;
      for (const [i, x] of timers) if (x.t <= end && (!due || x.t < due[1].t)) due = [i, x];
      if (!due) break;
      const [i, x] = due;
      vnow = x.t;
      if (x.every) x.t += x.every; else timers.delete(i);
      try { x.fn(...x.a); } catch (e) { console.error(e); }
      await flush();
      syncAnimations();
    }
    vnow = end;
    await flush();
    syncAnimations();
  }

  // ---- chrome.* stub: what background.js and the server would answer
  let onMessage = null;
  const reply = (msg) => {
    switch (msg && msg.type) {
      case 'stored': return { ok: false, error: 'nothing stored' };          // so the caption read runs
      case 'analyze': return { ok: true, status: 'done', segments: F.segments, cached: false };
      case 'poll': return { ok: true, status: 'done', segments: F.segments };
      default: return { ok: true };                                          // event, feedback, storedCheck
    }
  };
  const store = new URLSearchParams(location.search).has('debug') ? { settings: { devMode: true } } : {};
  window.chrome = {
    runtime: {
      lastError: undefined,
      sendMessage(msg, cb) { const r = reply(msg); Promise.resolve().then(() => cb && cb(r)); },
      onMessage: { addListener(fn) { onMessage = fn; } },
      getURL: (p) => `/ext/${p}`,
    },
    storage: {
      local: {
        get(key, cb) { const r = { [key]: store[key] }; if (cb) Promise.resolve().then(() => cb(r)); return Promise.resolve(r); },
        set(obj, cb) { Object.assign(store, obj); if (cb) Promise.resolve().then(cb); return Promise.resolve(); },
      },
      onChanged: { addListener() {} },
    },
  };

  // ---- page.js stand-in: answers content.js's caption request with the fixture's lines
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || d.source !== 'sr-content' || d.type !== 'getCaptions') return;
    window.postMessage({ source: 'sr-page', type: 'captions', videoId: d.videoId, lines: F.lines, lang: 'en', kind: 'asr',
                         path: 'A', title: F.video.title, creator: F.video.creator, channelId: F.video.channel_id,
                         description: F.description, paidPromotion: true, heat: [], build: 21 }, '*');
  });

  // ---- the player: a <video> with a duration and a playhead, and the chrome that shows them
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  let cur = 0;
  function paint() {
    const pct = (cur / F.video.duration) * 100;
    const q = (s) => document.querySelector(s);
    q('.m-played').style.width = `${pct}%`;
    q('.m-loaded').style.width = `${Math.min(100, pct + 6)}%`;
    q('.m-knob').style.left = `${pct}%`;
    q('.m-time').textContent = `${fmt(cur)} / ${fmt(F.video.duration)}`;
  }
  function wireVideo() {
    const v = document.querySelector('#movie_player video.html5-main-video');
    Object.defineProperty(v, 'duration', { get: () => F.video.duration });
    Object.defineProperty(v, 'seeking', { get: () => false });
    // content.js seeks by assigning currentTime: a seek, with its event. Playback (below) moves the playhead
    // without one, like a playing video does.
    Object.defineProperty(v, 'currentTime', { get: () => cur, set: (x) => { cur = +x; paint(); v.dispatchEvent(new Event('seeking')); } });
    return v;
  }

  window.__mock = {
    async ready() {   // the markers are drawn once content.js has the analysis
      for (let i = 0; i < 200 && !document.querySelector('.sr-lane .sr-marker'); i++) await advance(50);
      return document.querySelectorAll('.sr-lane .sr-marker').length;
    },
    async play(t, step = 0.25) {   // playback from the current playhead to t, with timeupdate events like a video
      const v = document.querySelector('#movie_player video.html5-main-video');
      if (t < cur) { cur = t; paint(); v.dispatchEvent(new Event('timeupdate')); return; }
      while (cur < t - 1e-6) {
        const before = cur;
        cur = Math.min(t, cur + step);
        paint();
        v.dispatchEvent(new Event('timeupdate'));
        await flush();
        syncAnimations();
        if (cur < before || cur > t + step) break;   // content.js seeked (a skip): stop here
      }
    },
    jump(t) { cur = t; paint(); },
    advance,
    hover(i) {   // hover the i-th marker: content.js's own mouseenter handler draws the tooltip
      const m = document.querySelectorAll('.sr-lane .sr-marker')[i];
      m.dispatchEvent(new MouseEvent('mouseenter'));
      m.style.transform = 'scaleY(1.5)';   // :hover, which a synthetic event does not set
      const r = m.getBoundingClientRect(), p = document.querySelector('.m-pointer');
      p.style.left = `${r.left + r.width * 0.55}px`; p.style.top = `${r.top + 1}px`; p.style.display = 'block';
    },
    state() { return new Promise((r) => onMessage({ type: 'getState' }, null, r)); },   // what the popup is told
    rect(sel) { const e = document.querySelector(sel); if (!e) return null; const r = e.getBoundingClientRect(); return { x: r.left, y: r.top, width: r.width, height: r.height }; },
    now: () => cur,
  };
  window.__mock.init = () => { wireVideo(); window.__mock.jump(F.start || 0); };   // called before content.js loads
})();
</script>
</head>
<body>

    <path d="M860 560 q22 8 44 0 l-6 8 q-16 5 -32 0 z" fill="#0f1020"/><path d="M880 560 l0 -26 l14 24 z" fill="#d9c7c7" opacity=".7"/>
  </svg>
  <video class="html5-main-video"></video>
  <div class="m-shade"></div>
  <div class="ytp-progress-bar-container">
    <div class="ytp-progress-bar"><div class="m-loaded"></div><div class="m-played"></div><div class="m-knob"></div></div>
